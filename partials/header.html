<header class="site-header">
  <script src="/assets/js/i/da4ce86a1a03.js"></script>
  <div class="site-header-inner">

    <!-- Brand -->
    <a href="/" class="site-brand" aria-label="PODFY home">
      <img src="/assets/podfy.svg" alt="PODFY" width="72" height="20" />
    </a>

    <!-- Desktop nav: Demo · Solutions · Guides · Insights · Pricing · Contact -->
    <nav id="primaryNav" class="site-nav" aria-label="Primary navigation">
      <a href="/demo">Demo</a>
      <a href="/solutions/">Solutions</a>
      <a href="/guides/">Guides</a>
      <a href="/insights/">Insights</a>
      <a href="/pricing">Pricing</a>
      <a href="/contact">Contact</a>
    </nav>

    <!-- Right cluster: trust pill · locale · theme · hamburger -->
    <div class="site-header-actions">

      <!-- EU trust pill — always visible on ≥640 px -->
      <span class="site-eu-mark" aria-label="Hosted in the EU (Cloudflare EU jurisdiction)">EU&thinsp;&middot;&thinsp;only</span>

      <!-- Locale switcher -->
      <div class="site-locale" id="localeWrapper" aria-label="Language">
        <button
          class="site-locale-btn"
          id="localeBtn"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="localeMenu">EN &#9662;</button>
        <div
          class="site-locale-menu"
          id="localeMenu"
          role="listbox"
          aria-label="Select language">
          <a href="/" class="site-locale-item site-locale-active" role="option" aria-selected="true" data-lang="en">EN</a>
          <a href="/nl/" class="site-locale-item" role="option" aria-selected="false" data-lang="nl">NL</a>
          <a href="/de/" class="site-locale-item" role="option" aria-selected="false" data-lang="de">DE</a>
          <a href="/fr/" class="site-locale-item" role="option" aria-selected="false" data-lang="fr">FR</a>
        </div>
      </div>

      <!-- Theme toggle (cycles System → Light → Dark) -->
      <button
        type="button"
        class="site-theme-toggle"
        id="themeToggle"
        data-mode="system"
        aria-label="Toggle colour mode">
        <span class="site-theme-dot"></span>
        <span class="site-theme-label">System</span>
      </button>

      <!-- Mobile hamburger (hidden ≥768 px) -->
      <button
        type="button"
        id="menuBtn"
        class="site-menu-btn"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </div>

  <!-- Mobile nav drawer -->
  <nav id="mobileNav" class="site-mobile-nav" aria-label="Mobile navigation">
    <a href="/demo">Demo</a>
    <a href="/solutions/">Solutions</a>
    <a href="/guides/">Guides</a>
    <a href="/insights/">Insights</a>
    <a href="/pricing">Pricing</a>
    <a href="/contact">Contact</a>
    <a href="/trust" data-u="udd9df6c">Trust &amp; Legal</a>
  </nav>

  <script src="/assets/js/i/d022f0e50504.js"></script>
</header>
