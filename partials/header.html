<header class="site-header">
  <div class="site-header-inner">
    <!-- Logo -->
    <a href="/" class="site-header-logo">
      <img src="/assets/podfy-logo.svg" alt="Podfy" class="h-7 w-auto" />
      <span class="site-header-logo-text">Podfy</span>
    </a>

    <!-- Desktop navigation -->
    <nav class="site-header-nav">
      <a href="#how-it-works" class="site-header-nav-link">How it works</a>
      <a href="#benefits" class="site-header-nav-link">Benefits</a>
      <a href="#features" class="site-header-nav-link">Features</a>
      <a href="#pricing" class="site-header-nav-link">Pricing &amp; Plans</a>
      <a href="#faq" class="site-header-nav-link">FAQ</a>
    </nav>

    <!-- Desktop actions -->
    <div class="site-header-actions">
      <a
        href="https://demo.podfy.net/"
        class="primary-cta"
      >
        Try a demo upload
      </a>
      <a
        href="#request-demo"
        class="secondary-cta"
      >
        Request a demo
      </a>

      <!-- Mobile menu button -->
      <button
        id="menuBtn"
        type="button"
        class="site-header-menu-btn md:hidden"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile navigation -->
  <nav id="mobileNav" class="site-header-mobile-nav md:hidden">
    <a href="#how-it-works">How it works</a>
    <a href="#benefits">Benefits</a>
    <a href="#features">Features</a>
    <a href="#pricing">Pricing &amp; Plans</a>
    <a href="#faq">FAQ</a>
    <a href="https://demo.podfy.net/" class="primary-cta block text-center mt-2">
      Try a demo upload
    </a>
    <a href="#request-demo" class="secondary-cta block text-center mt-2">
      Request a demo
    </a>
  </nav>

  <script>
    (function () {
      var btn = document.getElementById("menuBtn");
      var nav = document.getElementById("mobileNav");
      if (!btn || !nav) return;

      btn.addEventListener("click", function () {
        var isHidden = nav.classList.contains("hidden");
        nav.classList.toggle("hidden", !isHidden);
        btn.setAttribute("aria-expanded", String(isHidden));
      });

      // Start hidden on load
      nav.classList.add("hidden");
    })();
  </script>
</header>
