<header class="site-header-shell">
  <div class="site-header-inner">
    <!-- Brand -->
    <a href="/" class="site-brand" aria-label="PODFY home">
      <img src="/assets/podfy.svg" alt="PODFY">
      <span class="site-brand-title">PODFY</span>
    </a>

    <!-- Desktop navigation -->
    <nav id="primaryNav" class="site-nav">
      <a href="/#how">How it works</a>
      <a href="/#value">Benefits</a>
      <a href="/#features">Features</a>
      <a href="/#solutions">Pricing &amp; Plans</a>
      <a href="/#faq">FAQ</a>
      <a href="/releases" class="text-brand font-semibold">Release notes</a>
    </nav>

    <!-- Actions & theme toggle -->
    <div class="site-header-actions">
      <!-- Theme toggle pill -->
      <button
        id="themeToggle"
        type="button"
        class="site-theme-toggle"
        data-mode="system"
        aria-label="Toggle color theme"
      >
        <span class="site-theme-dot"></span>
        <span class="site-theme-label">System</span>
      </button>

      <!-- CTAs (desktop) -->
      <a href="/demo" class="site-cta-primary hidden md:inline-flex">
        Try a demo upload
      </a>
      <a href="/#contact" class="site-cta-secondary hidden md:inline-flex">
        Request a demo
      </a>

      <!-- Hamburger (mobile) -->
      <button
        id="menuBtn"
        type="button"
        class="site-menu-btn md:hidden"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile nav -->
  <nav id="mobileNav" class="site-mobile-nav md:hidden">
    <a href="/#how">How it works</a>
    <a href="/#value">Benefits</a>
    <a href="/#features">Features</a>
    <a href="/#solutions">Pricing &amp; Plans</a>
    <a href="/#faq">FAQ</a>
    <a href="/releases">Release notes</a>
    <a href="/demo" class="site-cta-primary mt-2 mx-4 justify-center">
      Try a demo upload
    </a>
    <a href="/#contact" class="site-cta-secondary mt-2 mx-4 justify-center">
      Request a demo
    </a>
  </nav>

  <script>
    (function () {
      var menuBtn = document.getElementById("menuBtn");
      var mobileNav = document.getElementById("mobileNav");
      if (!menuBtn || !mobileNav) return;

      menuBtn.addEventListener("click", function () {
        var isOpen = mobileNav.classList.contains("open");
        mobileNav.classList.toggle("open", !isOpen);
        menuBtn.setAttribute("aria-expanded", String(!isOpen));
      });
    })();
  </script>
</header>
