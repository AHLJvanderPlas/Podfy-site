<header class="border-b border-slate-100">
  <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3" aria-label="PODFY home">
      <img src="/assets/podfy.svg" alt="PODFY" class="h-7 w-auto">
    </a>

    <!-- Mobile menu button -->
    <button
      id="menuBtn"
      class="md:hidden p-2 rounded border border-slate-300"
      aria-controls="primaryNav"
      aria-expanded="false"
      aria-label="Open navigation"
    >
      <span class="block h-0.5 w-5 bg-slate-800 mb-1"></span>
      <span class="block h-0.5 w-5 bg-slate-800 mb-1"></span>
      <span class="block h-0.5 w-5 bg-slate-800"></span>
    </button>

    <!-- Desktop navigation -->
    <nav
      id="primaryNav"
      class="hidden md:flex items-center gap-8 text-sm"
    >
      <a href="/#how" class="hover:text-brand">How it works</a>
      <a href="/#value" class="hover:text-brand">Benefits</a>
      <a href="/#features" class="hover:text-brand">Features</a>
      <a href="/#solutions" class="hover:text-brand">Pricing &amp; Plans</a>
      <a href="/#faq" class="hover:text-brand">FAQ</a>
      <a href="/releases" class="text-brand font-semibold">Release notes</a>
    </nav>

    <!-- Desktop actions -->
    <div class="hidden md:flex items-center gap-3">
      <a href="/demo" class="btn btn-accent text-sm">Try a demo upload</a>
      <a href="/#contact" class="btn btn-outline text-sm">Request a demo</a>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById("menuBtn");
      var nav = document.getElementById("primaryNav");
      if (!btn || !nav) return;

      function setExpanded(expanded) {
        btn.setAttribute("aria-expanded", String(expanded));
        if (expanded) {
          nav.classList.remove("hidden");
        } else {
          nav.classList.add("hidden");
        }
      }

      // Ensure correct initial state on load (mobile = hidden, desktop handled by CSS)
      setExpanded(false);

      btn.addEventListener("click", function () {
        var isExpanded = btn.getAttribute("aria-expanded") === "true";
        setExpanded(!isExpanded);
      });
    })();
  </script>
</header>
