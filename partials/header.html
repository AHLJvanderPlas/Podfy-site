<header class="site-header">
  <script>
  (function(){
    var p = window.location.pathname;
    var lc = /^\/nl(\/|$)/.test(p) ? 'nl'
           : /^\/de(\/|$)/.test(p) ? 'de'
           : /^\/fr(\/|$)/.test(p) ? 'fr' : '';
    if (!lc) return;
    document.addEventListener('DOMContentLoaded', function(){
      ['primaryNav','mobileNav'].forEach(function(id){
        var nav = document.getElementById(id);
        if (!nav) return;
        nav.querySelectorAll('a[href="/pricing"]').forEach(function(a){
          a.setAttribute('href', '/' + lc + '/pricing');
        });
      });
    });
  })();
  </script>
  <div class="site-header-inner">

    <!-- Brand -->
    <a href="/" class="site-brand" aria-label="PODFY home">
      <img src="/assets/podfy.svg" alt="PODFY" width="72" height="20" />
    </a>

    <!-- Desktop nav: Demo · Solutions · Guides · Pricing · Contact -->
    <nav id="primaryNav" class="site-nav" aria-label="Primary navigation">
      <a href="/demo">Demo</a>
      <a href="/solutions/">Solutions</a>
      <a href="/guides/">Guides</a>
      <a href="/pricing">Pricing</a>
      <a href="/contact">Contact</a>
    </nav>

    <!-- Right cluster: trust pill · locale · theme · hamburger -->
    <div class="site-header-actions">

      <!-- EU trust pill — always visible on ≥640 px -->
      <span class="site-eu-mark" aria-label="Hosted in EU, Cloudflare WEUR region">EU&thinsp;&middot;&thinsp;WEUR</span>

      <!-- Locale switcher -->
      <div class="site-locale" id="localeWrapper" aria-label="Language">
        <button
          class="site-locale-btn"
          id="localeBtn"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="localeMenu">EN &#9662;</button>
        <div
          class="site-locale-menu"
          id="localeMenu"
          role="listbox"
          aria-label="Select language">
          <a href="/" class="site-locale-item site-locale-active" role="option" aria-selected="true" data-lang="en">EN</a>
          <a href="/nl/" class="site-locale-item" role="option" aria-selected="false" data-lang="nl">NL</a>
          <a href="/de/" class="site-locale-item" role="option" aria-selected="false" data-lang="de">DE</a>
          <a href="/fr/" class="site-locale-item" role="option" aria-selected="false" data-lang="fr">FR</a>
        </div>
      </div>

      <!-- Theme toggle (cycles System → Light → Dark) -->
      <button
        type="button"
        class="site-theme-toggle"
        id="themeToggle"
        data-mode="system"
        aria-label="Toggle colour mode">
        <span class="site-theme-dot"></span>
        <span class="site-theme-label">System</span>
      </button>

      <!-- Mobile hamburger (hidden ≥768 px) -->
      <button
        type="button"
        id="menuBtn"
        class="site-menu-btn"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="mobileNav">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </div>

  <!-- Mobile nav drawer -->
  <nav id="mobileNav" class="site-mobile-nav" aria-label="Mobile navigation">
    <a href="/demo">Demo</a>
    <a href="/solutions/">Solutions</a>
    <a href="/guides/">Guides</a>
    <a href="/pricing">Pricing</a>
    <a href="/contact">Contact</a>
    <a href="/trust" style="margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line);">Trust &amp; Legal</a>
  </nav>

  <script>
    /* FOUC prevention: apply saved theme immediately, before paint */
    (function () {
      try {
        var stored = localStorage.getItem("podfy-theme");
        var effective = (stored === "light" || stored === "dark")
          ? stored
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", effective);
      } catch (e) {}
    })();

    /* Mobile nav + locale switcher, progressive enhancement */
    document.addEventListener("DOMContentLoaded", function () {

      /* Mobile menu toggle */
      var menuBtn  = document.getElementById("menuBtn");
      var mobileNav = document.getElementById("mobileNav");
      if (menuBtn && mobileNav) {
        menuBtn.addEventListener("click", function () {
          var open = mobileNav.classList.toggle("open");
          menuBtn.setAttribute("aria-expanded", String(open));
        });
      }

      /* Locale switcher toggle */
      var localeBtn  = document.getElementById("localeBtn");
      var localeMenu = document.getElementById("localeMenu");
      if (localeBtn && localeMenu) {
        localeBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var open = localeMenu.classList.toggle("open");
          localeBtn.setAttribute("aria-expanded", String(open));
        });
        document.addEventListener("click", function () {
          localeMenu.classList.remove("open");
          if (localeBtn) localeBtn.setAttribute("aria-expanded", "false");
        });
      }

      /* ── Locale-aware navigation ── */
      (function () {
        var path = window.location.pathname;
        var locale = /^\/nl(\/|$)/.test(path) ? "nl"
                   : /^\/de(\/|$)/.test(path) ? "de"
                   : /^\/fr(\/|$)/.test(path) ? "fr" : "";

        /* Update button label */
        if (localeBtn && locale) {
          localeBtn.innerHTML = locale.toUpperCase() + " &#9662;";
        }

        /* Use hreflang <link> tags so each locale item points to the
           equivalent page, not just the locale home page */
        var hreflangs = {};
        document.querySelectorAll("link[rel='alternate'][hreflang]").forEach(function (el) {
          hreflangs[el.getAttribute("hreflang")] = el.getAttribute("href");
        });
        document.querySelectorAll("#localeMenu [data-lang]").forEach(function (el) {
          var lang = el.getAttribute("data-lang");
          var isActive = (lang === locale) || (lang === "en" && !locale);
          el.classList.toggle("site-locale-active", isActive);
          if (el.tagName === "A") {
            var target = hreflangs[lang] || (lang === "en" ? "/" : "/" + lang + "/");
            el.setAttribute("href", target);
            el.setAttribute("aria-selected", String(isActive));
          }
        });

        /* Rewrite header + mobile nav links for NL/DE locales */
        if (locale) {
          var pfx = "/" + locale;
          ["primaryNav", "mobileNav"].forEach(function (navId) {
            var nav = document.getElementById(navId);
            if (!nav) return;
            nav.querySelectorAll("a[href]").forEach(function (a) {
              var h = a.getAttribute("href");
              if (h && h.charAt(0) === "/" && !/^\/(nl|de|fr)(\/|$)/.test(h)) {
                a.setAttribute("href", pfx + h);
              }
            });
          });
        }
      })();

    });
  </script>
</header>
