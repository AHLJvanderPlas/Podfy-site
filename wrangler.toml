name = "podfy-site"
compatibility_date = "2025-10-18"
pages_build_output_dir = "."

# Site-only DB: Site_Releases, Site_Buyer, Site_Form + insights (blog_posts, repository_items)
[[d1_databases]]
binding = "DB"
database_name = "podfy-public-eu"
database_id = "95eff956-7f07-421c-9c0a-e837724b22d2"

# Main DB: newsletter subscriptions only (brand_users under 'newsletter' brand)
[[d1_databases]]
binding = "MAIN_DB"
database_name = "podfy-main-eu"
database_id = "a848b69c-58bd-45bd-b3f5-d6dcaf178d70"

[[r2_buckets]]
binding = "PODFY_BUCKET"
bucket_name = "podfy-uploads-eu"
jurisdiction = "eu"

[vars]
# RESEND_API_KEY = set as secret in CF Pages dashboard
# TURNSTILE_SECRET = set as secret in CF Pages dashboard
# PORTAL_SESSION_SECRET = set as secret in CF Pages dashboard
