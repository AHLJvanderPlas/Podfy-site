<svg
  role="img"
  aria-labelledby="podfyPhoneTitle podfyPhoneDesc"
  viewBox="0 0 640 420"
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  style="max-width: 720px; height: auto"
>
  <title id="podfyPhoneTitle">Hand holding a smartphone showing the Podfy logo</title>
  <desc id="podfyPhoneDesc">Illustration of a phone in a hand with Podfy branding on the screen, adaptive to light and dark modes.</desc>

  <!-- Styles: brand tokens + light/dark adaptation -->
  <style>
    :root{
      --brand-primary: #1D3557;
      --brand-accent:  #06D6A0;
      --ink:           #0F172A;
      --muted:         #475569;
      --card:          #FFFFFF;
      --cardEdge:      #E2E8F0;
      --bgGradA:       #F0F4F9;
      --bgGradB:       #FFFFFF;
      --shadow:        rgba(16,24,40,.14);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --ink:       #E5E7EB;
        --muted:     #94A3B8;
        --card:      #0F172A;
        --cardEdge:  #243140;
        --bgGradA:   #0E2237;
        --bgGradB:   #0B1220;
        --shadow:    rgba(0,0,0,.40);
      }
    }
    .bg-grad { fill: url(#bg); }
    .ink     { stroke: var(--ink); }
    .fill-ink{ fill: var(--ink); }
    .muted   { fill: var(--muted); }
    .card    { fill: var(--card); stroke: var(--cardEdge); }
    .primary { stroke: var(--brand-primary); }
    .accentF { fill: var(--brand-accent); }
    .accentS { stroke: var(--brand-accent); }
    .round   { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Subtle background / container -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--bgGradA)"/>
      <stop offset="1" stop-color="var(--bgGradB)"/>
    </linearGradient>

    <!-- Soft shadow for the phone -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="var(--shadow)"/>
    </filter>

    <!-- Podfy logo mark (cube + check) as a symbol -->
    <symbol id="podfy-mark" viewBox="0 0 64 64">
      <!-- cube outline -->
      <path class="primary round" d="M12 24l20-10 20 10v16L32 50 12 40V24z" fill="none" stroke-width="4"/>
      <path class="primary round" d="M32 14v36" fill="none" stroke-width="4"/>
      <path class="primary round" d="M12 24l20 10 20-10" fill="none" stroke-width="4"/>
      <!-- check accent -->
      <path class="accentS round" d="M24 33l6 6 12-12" fill="none" stroke-width="6"/>
    </symbol>
  </defs>

  <!-- Background panel -->
  <rect class="bg-grad" x="0" y="0" width="640" height="420" rx="20"/>

  <!-- Hand (neutral duotone silhouette, avoiding skin tones) -->
  <g transform="translate(60,100)">
    <!-- Wrist / sleeve -->
    <path d="M30 200 h120 a14 14 0 0 0 14-14 v-28 a24 24 0 0 0 -24-24 h-44 a30 30 0 0 1 -30 -30 v-20 a22 22 0 0 0 -44 0 v78 a38 38 0 0 0 38 38z"
          fill="url(#sleeveGrad)"/>
    <linearGradient id="sleeveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--brand-primary)" stop-opacity=".18"/>
      <stop offset="1" stop-color="var(--brand-primary)" stop-opacity=".10"/>
    </linearGradient>

    <!-- Palm/back of hand -->
    <path d="M132 72 c-10 0-19 8-20 18l-6 57c-1 10 7 18 17 18h70c12 0 22-9 24-21l6-36c2-12-6-22-18-24l-73-12z"
          fill="rgba(15,23,42,.08)"/>

    <!-- Thumb -->
    <path d="M110 142 c-3 8 2 16 10 18l30 8c10 2 20-4 22-14l2-10c2-10-5-20-15-22l-28-6c-10-2-18 4-21 12z"
          fill="rgba(15,23,42,.10)"/>
  </g>

  <!-- Phone group -->
  <g transform="translate(240,60)" filter="url(#softShadow)">
    <!-- Phone body -->
    <rect class="card" x="0" y="0" width="200" height="320" rx="26" stroke-width="2"/>
    <!-- Speaker and home indicator -->
    <rect class="muted" x="86" y="14" width="28" height="6" rx="3"/>
    <rect class="muted" x="70" y="300" width="60" height="6" rx="3"/>

    <!-- Screen area (slightly inset) -->
    <rect x="14" y="32" width="172" height="256" rx="14" fill="none" stroke="var(--cardEdge)"/>

    <!-- Podfy logo on the screen -->
    <g transform="translate(36,90)">
      <use href="#podfy-mark" width="128" height="128"/>
      <!-- Brand label -->
      <text x="64" y="152" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif"
            font-size="22" class="fill-ink" style="font-weight:700; letter-spacing:.5px">PODFY</text>
      <!-- CTA chip -->
      <g transform="translate(22,174)">
        <rect x="0" y="0" rx="12" width="84" height="28" fill="rgba(6,214,160,0.12)" stroke="var(--brand-accent)"/>
        <circle class="accentF" cx="14" cy="14" r="5"/>
        <text x="28" y="18" font-size="13" class="fill-ink" style="font-weight:600">Uploaded</text>
      </g>
    </g>
  </g>

  <!-- Little sparks/accent dots -->
  <circle class="accentF" cx="520" cy="88" r="4"/>
  <circle class="accentF" cx="540" cy="108" r="3"/>
  <circle class="accentF" cx="504" cy="116" r="2"/>
</svg>
