<!-- phone-hand-check.svg -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     viewBox="0 0 612 612" width="100%" style="max-width:640px;height:auto">
  <title id="t">Phone in hand with approval check</title>
  <desc id="d">Minimal illustration of a hand holding a smartphone showing a green check mark. Colors adapt to light and dark modes.</desc>

  <!-- THEME (light/dark) -->
  <style>
    :root{
      --bg:        #AEE0EE;      /* soft sky */
      --phone:     #1D2B4A;      /* phone body */
      --screen:    #FFFFFF;      /* screen */
      --edge:      #D7E0EA;      /* outlines on light */
      --hand:      #EAD9C9;      /* hand */
      --hand2:     #F2E5D8;      /* finger/palm tone */
      --sleeve:    #0F5A8A;      /* jacket */
      --check:     #06D6A0;      /* accent green */
      --ink:       #0F172A;      /* text/lines if needed */
      --shadow:    rgba(16,24,40,.12);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:      #0E2237;
        --phone:   #E6ECF5;
        --screen:  #0F172A;
        --edge:    #244055;
        --hand:    #2A3545;
        --hand2:   #303E52;
        --sleeve:  #0D6AA8;
        --check:   #06D6A0;
        --ink:     #E5E7EB;
        --shadow:  rgba(0,0,0,.35);
      }
    }
    .stroke{stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    path,rect,circle{shape-rendering:geometricPrecision}
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="612" height="612" fill="var(--bg)"/>

  <!-- Ground shadow -->
  <ellipse cx="306" cy="560" rx="180" ry="18" fill="var(--shadow)"/>

  <!-- Left hand holding phone (back hand) -->
  <g transform="translate(180,150)">
    <path d="M30,200 c-8,-48 14,-78 46,-78h62c22,0 40,18 40,40v60c0,22 -18,40 -40,40H72
             c-34,0 -58,-23 -42,-62z"
          fill="var(--hand)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
    <!-- knuckles -->
    <circle cx="210" cy="162" r="10" fill="var(--hand)"/>
    <circle cx="200" cy="190" r="10" fill="var(--hand)"/>
    <circle cx="188" cy="216" r="10" fill="var(--hand)"/>
  </g>

  <!-- Phone -->
  <g transform="translate(206,90)">
    <!-- body -->
    <rect x="0" y="0" width="200" height="360" rx="24"
          fill="var(--phone)"/>
    <!-- screen -->
    <rect x="16" y="44" width="168" height="272" rx="14"
          fill="var(--screen)"/>
    <!-- camera dot + speaker -->
    <circle cx="100" cy="20" r="4" fill="#8090A0" opacity=".6"/>
    <!-- home bar -->
    <rect x="70" y="330" width="60" height="8" rx="4" fill="#8090A0" opacity=".6"/>

    <!-- check badge (center) -->
    <g transform="translate(56,136)">
      <circle cx="44" cy="44" r="44" fill="var(--check)"/>
      <path d="M26,46 l14,14 30,-30" fill="none" stroke="#fff" stroke-width="10" class="stroke"/>
    </g>
  </g>

  <!-- Fore hand & finger tapping (front hand) -->
  <g transform="translate(244,308)">
    <!-- sleeve -->
    <rect x="-36" y="108" width="120" height="64" rx="8" fill="var(--sleeve)"/>
    <!-- wrist connector -->
    <rect x="-20" y="98" width="88" height="14" rx="6" fill="#E6EAF0" opacity=".7"/>
    <!-- palm -->
    <path d="M72,32 c16,0 28,12 28,28v58c0,22 -18,40 -40,40H8c-18,0 -32,-14 -32,-32v-22
             c0,-18 14,-32 32,-32h24c4,-16 16,-40 40,-40z"
          fill="var(--hand2)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
    <!-- index finger (tapping) -->
    <path d="M24,36 c-10,8 -12,22 -6,32l18,30c8,14 26,18 40,10l6,-4c14,-8 18,-26 10,-40l-10,-18
             c-10,-18 -34,-22 -50,-10z"
          fill="var(--hand2)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
  </g>
</svg>
