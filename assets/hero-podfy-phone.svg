<!-- phone-in-hand.svg -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     viewBox="0 0 480 360" width="100%" style="max-width:640px;height:auto">
  <title id="t">Phone in hand with Podfy logo</title>
  <desc id="d">Simple illustration of a neutral hand holding a phone that shows the Podfy logo. Adapts to light and dark mode.</desc>

  <!-- ===== Theming (light/dark) ===== -->
  <style>
    :root{
      --brand-primary:#1D3557;   /* outlines/icons on light */
      --brand-accent:#06D6A0;    /* small accent check */
      --ink:#0F172A;             /* dark ink on light */
      --hand:#E8EEF5;            /* hand/sleeve fill (neutral) */
      --phone:#F7FAFC;           /* phone shell */
      --edge:#D9E1EC;            /* device/hand edge */
      --screen:#FFFFFF;          /* phone screen */
      --shadowA:rgba(16,24,40,.08);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --brand-primary:#D0D8EA; /* outlines/icons on dark */
        --ink:#E5E7EB;           /* light ink on dark */
        --hand:#1A2332;          /* hand/sleeve fill (neutral dark) */
        --phone:#E6ECF5;         /* light device against dark bg */
        --edge:#B9C6D8;          /* device/hand edge on dark */
        --screen:#0F172A;        /* dark screen */
        --shadowA:rgba(0,0,0,.35);
      }
    }

    .stroke      { stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke }
    .deviceEdge  { stroke:var(--edge); }
    .brandStroke { stroke:var(--brand-primary); }
    .inkFill     { fill:var(--ink); }
  </style>

  <!-- ===== Podfy mark symbol (cube + check) ===== -->
  <symbol id="podfy-mark" viewBox="0 0 64 64">
    <path class="stroke brandStroke" stroke-width="4"
          d="M12 24l20-10 20 10v16L32 50 12 40V24z" fill="none"/>
    <path class="stroke brandStroke" stroke-width="4" d="M32 14v36M12 24l20 10 20-10" fill="none"/>
    <path class="stroke" stroke="var(--brand-accent)" stroke-width="6" d="M24 33l7 7 11-11" fill="none"/>
  </symbol>

  <!-- ===== Soft “ground” shadow (no filters) ===== -->
  <ellipse cx="240" cy="330" rx="160" ry="16" fill="var(--shadowA)"/>

  <!-- ===== Hand (neutral, no skin tone) ===== -->
  <g transform="translate(40,150)">
    <!-- palm/back -->
    <path d="M110 30c-10 0-18 8-19 18l-6 52c-1 9 6 17 15 18l152 14c12 1 22-7 24-19l6-34c2-12-6-22-18-24l-154-25z"
          fill="var(--hand)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
    <!-- thumb -->
    <path d="M96 96c-3 8 2 16 10 18l42 10c10 2 20-4 22-14l2-10c2-10-5-20-15-22l-40-8c-10-2-18 4-21 12z"
          fill="var(--hand)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
    <!-- sleeve -->
    <path d="M-8 86c10 24 38 38 68 38h62a22 22 0 0 0 22-22v-20a24 24 0 0 0-24-24H76c-18 0-32-14-32-32v-8c0-12-10-22-22-22S-8 6-8 18v68z"
          fill="var(--hand)" opacity=".85"/>
  </g>

  <!-- ===== Phone ===== -->
  <g transform="translate(220,40)">
    <!-- body -->
    <rect x="0" y="0" width="160" height="280" rx="22"
          fill="var(--phone)" stroke="var(--edge)" stroke-width="2" class="stroke"/>
    <!-- speaker + home bar -->
    <rect x="70" y="10" width="20" height="4" rx="2" fill="var(--edge)"/>
    <rect x="52" y="268" width="56" height="4" rx="2" fill="var(--edge)" opacity=".7"/>
    <!-- screen -->
    <rect x="10" y="26" width="140" height="228" rx="12"
          fill="var(--screen)" stroke="var(--edge)" stroke-width="1.5" class="stroke"/>
    <!-- Podfy mark on screen -->
    <g transform="translate(28,64)">
      <use href="#podfy-mark" width="104" height="104"/>
      <text x="52" y="122" text-anchor="middle"
            font-size="16" font-weight="700" class="inkFill"
            style="letter-spacing:.4px">PODFY</text>
    </g>
  </g>
</svg>
