<!-- phone-podfy.svg -->
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"
     viewBox="0 0 360 720" width="100%" style="height:auto;max-width:420px">
  <title id="t">Podfy uploader UI on a smartphone</title>
  <desc id="d">Vector phone mock showing the Podfy logo, an upload panel with two buttons, a checkbox row, and a green submit button. Colors adapt to light and dark mode.</desc>

  <!-- ===== THEME TOKENS ===== -->
  <style>
    :root{
      --brand-primary:#1D3557;   /* headings/icons (light) */
      --brand-accent:#06D6A0;    /* CTA green */
      --ink:#0F172A;             /* main text */
      --muted:#475569;           /* secondary text */
      --edge:#E2E8F0;            /* borders */
      --screen:#FFFFFF;          /* phone screen */
      --shell:#F5F7FB;           /* phone shell */
      --shell-edge:#DEE5EF;      /* shell stroke */
      --chip:#EEF2F7;            /* light chips */
      --dropHint:#CBD5E1;        /* dashed border */
    }
    @media (prefers-color-scheme: dark){
      :root{
        --brand-primary:#A5B4CF; /* tuned for dark */
        --ink:#E5E7EB;
        --muted:#94A3B8;
        --edge:#243140;
        --screen:#0F172A;
        --shell:#E6EBF2;
        --shell-edge:#CAD3E1;
        --chip:#1A2535;
        --dropHint:#334559;
      }
    }

    /* helpers */
    .shellF   { fill:var(--shell); stroke:var(--shell-edge); }
    .screenF  { fill:var(--screen); stroke:var(--edge); }
    .inkF     { fill:var(--ink); }
    .mutedF   { fill:var(--muted); }
    .brandS   { stroke:var(--brand-primary); }
    .accentF  { fill:var(--brand-accent); }
    .accentS  { stroke:var(--brand-accent); }
    .edgeS    { stroke:var(--edge); }
    .round    { stroke-linecap:round; stroke-linejoin:round; }
    .thin     { stroke-width:1.5; }
    .med      { stroke-width:2; }
    .thick    { stroke-width:3.5; }
    /* crisp lines when scaled */
    path,rect,circle,line,polyline{ vector-effect:non-scaling-stroke; shape-rendering:geometricPrecision; }
    text{ font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, "Noto Sans", "Helvetica Neue", sans-serif; }
  </style>

  <!-- ===== SYMBOL: Podfy cube + check ===== -->
  <symbol id="podfy-mark" viewBox="0 0 64 64">
    <path class="brandS round thick" d="M12 24l20-10 20 10v16L32 50 12 40V24z" fill="none"/>
    <path class="brandS round thick" d="M32 14v36M12 24l20 10 20-10" fill="none"/>
    <path class="accentS round thick" d="M24 33l7 7 11-11" fill="none"/>
  </symbol>

  <!-- ===== PHONE SHELL ===== -->
  <!-- faux shadow (no filters) -->
  <ellipse cx="180" cy="686" rx="140" ry="18" fill="rgba(0,0,0,.10)"/>
  <rect x="40" y="20" width="280" height="680" rx="44" class="shellF med"/>
  <!-- notch + helpers -->
  <rect x="120" y="40" width="120" height="22" rx="11" fill="#fff" opacity=".65"/>
  <rect x="160" y="36" width="40" height="6" rx="3" class="mutedF" opacity=".55"/>

  <!-- ===== SCREEN ===== -->
  <rect x="58" y="72" width="244" height="600" rx="22" class="screenF med"/>

  <!-- ===== UI CONTENT ===== -->
  <g transform="translate(58,72)">
    <!-- top brand row -->
    <g transform="translate(20,28)">
      <use href="#podfy-mark" width="28" height="28"/>
      <text x="38" y="22" class="inkF" style="font-size:22px;font-weight:700;letter-spacing:.4px">Podfy</text>
    </g>

    <!-- H1 -->
    <text x="20" y="110" class="inkF"
          style="font-size:28px;font-weight:800;letter-spacing:.2px">Upload CMR / POD</text>

    <!-- dashed dropzone -->
    <g transform="translate(20,130)">
      <rect x="0" y="0" width="204" height="190" rx="14" fill="none"
            stroke="var(--dropHint)" stroke-width="2" stroke-dasharray="4 6"/>
      <g transform="translate(62,22)">
        <use href="#podfy-mark" width="80" height="80"/>
      </g>
      <text x="18" y="128" class="inkF" style="font-size:18px;font-weight:700">Upload CMR / POD</text>
      <text x="18" y="148" class="mutedF" style="font-size:12px">Drag &amp; drop your document here</text>

      <!-- buttons -->
      <g transform="translate(12,158)">
        <rect x="0" y="0" width="86" height="32" rx="10" fill="var(--chip)" class="edgeS thin"/>
        <text x="10" y="21" class="inkF" style="font-size:12px;font-weight:700">Choose file</text>

        <rect x="98" y="0" width="86" height="32" rx="10" fill="var(--chip)" class="edgeS thin"/>
        <text x="110" y="21" class="inkF" style="font-size:12px;font-weight:700">Take photo</text>
      </g>
    </g>

    <!-- checkbox row -->
    <g transform="translate(20,350)">
      <circle cx="12" cy="12" r="12" fill="rgba(6,214,160,.14)" class="edgeS thin"/>
      <circle cx="12" cy="12" r="6" class="accentF"/>
      <polyline points="8,12 11,15 17,9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="16" class="inkF" style="font-size:14px">Email me a copy</text>
    </g>

    <!-- submit button -->
    <g transform="translate(20,392)">
      <rect x="0" y="0" width="204" height="44" rx="12" class="accentF"/>
      <text x="102" y="28" text-anchor="middle" style="font-size:16px;font-weight:700" fill="#ffffff">Submit</text>
    </g>

    <!-- bottom home indicator -->
    <rect x="82" y="560" width="80" height="6" rx="3" class="mutedF" opacity=".65"/>
  </g>
</svg>
