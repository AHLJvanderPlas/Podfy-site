<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PODFY – Release Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    [[PODFY_HEADER]]

    <main class="page-content">
      <h1 style="font-size:2rem; margin-bottom:0.2rem;">Release notes</h1>
      <p style="color:var(--fg-soft); max-width:600px;">
        A concise log of updates to the Podfy app. Automatically populated from our internal release database.
      </p>

      <!-- Search -->
      <div style="margin-top:1.5rem;">
        <input id="release-search" class="search-input" placeholder="Search releases..." />
      </div>

      <!-- States -->
      <p id="releases-loading" style="margin-top:1rem; color:var(--fg-soft);">Loading release notes…</p>
      <p id="releases-empty" style="margin-top:1rem; color:var(--fg-soft); display:none;">No release notes found.</p>
      <p id="releases-error" style="margin-top:1rem; color:#e11d48; display:none;">Could not load release notes.</p>

      <!-- Desktop table -->
      <div id="releases-table-wrapper" style="margin-top:1.5rem; display:none; overflow-x:auto;">
        <table class="release-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Version</th>
              <th>Deployment</th>
              <th>Updates</th>
            </tr>
          </thead>
          <tbody id="releases-table-body"></tbody>
        </table>
      </div>

      <!-- Mobile cards -->
      <div id="releases-cards-wrapper" style="margin-top:1.5rem; display:none;"></div>
    </main>

    [[PODFY_FOOTER]]

    <script>
      // Basic helpers
      function escapeHtml(str) {
        return str ? str.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])) : '';
      }

      function linesToList(text) {
        if (!text) return '';
        const lines = text.split(/\r?\n/).map(x => x.trim()).filter(x => x.length);
        if (lines.length <= 1) return '<p>' + escapeHtml(lines[0] || text) + '</p>';
        return '<ul style="margin:0; padding-left:1.2rem;">' + lines.map(l => '<li>' + escapeHtml(l) + '</li>').join('') + '</ul>';
      }

      function toId(version) {
        return 'v-' + version.replace(/[^0-9a-z]/gi,'-');
      }

      // Fetch releases
      const url = '/api/releases';
      let releases = [];

      const loading = document.getElementById('releases-loading');
      const empty = document.getElementById('releases-empty');
      const error = document.getElementById('releases-error');
      const tableWrap = document.getElementById('releases-table-wrapper');
      const tableBody = document.getElementById('releases-table-body');
      const cardsWrap = document.getElementById('releases-cards-wrapper');
      const searchInput = document.getElementById('release-search');

      function render(filter='') {
        filter = filter.toLowerCase();
        const list = releases.filter(r => 
          (r.version + r.release_date + r.deployment_ref + r.fixes + r.new_features + r.area_tags)
            .toLowerCase()
            .includes(filter)
        );

        if (!list.length) {
          tableWrap.style.display = 'none';
          cardsWrap.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';

        // TABLE
        tableWrap.style.display = 'block';
        tableBody.innerHTML = list.map(r => `
          <tr id="${toId(r.version)}">
            <td>${escapeHtml(r.release_date)}</td>
            <td><strong>${escapeHtml(r.version)}</strong></td>
            <td>${escapeHtml(r.deployment_ref || '')}</td>
            <td>
              ${r.new_features ? `<div><div class="release-section-label">New</div>${linesToList(r.new_features)}</div>` : ''}
              ${r.fixes ? `<div style="margin-top:0.7rem;"><div class="release-section-label">Fixes</div>${linesToList(r.fixes)}</div>` : ''}
              ${r.area_tags ? r.area_tags.split(',').map(t => `<span class="release-tag">${escapeHtml(t)}</span>`).join('') : ''}
            </td>
          </tr>
        `).join('');

        // CARDS
        cardsWrap.style.display = 'block';
        cardsWrap.innerHTML = list.map(r => `
          <div class="release-card" id="${toId(r.version)}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:0.75rem; color:var(--fg-softer);">${escapeHtml(r.release_date)}</div>
                <div style="font-size:1rem; font-weight:600;">${escapeHtml(r.version)}</div>
              </div>
              ${r.deployment_ref ? `<div style="font-size:0.75rem; color:var(--fg-softer);">Deploy ${escapeHtml(r.deployment_ref)}</div>` : ''}
            </div>

            ${r.new_features ? `<div style="margin-top:0.9rem;">
              <div class="release-section-label">New</div>
              ${linesToList(r.new_features)}
            </div>` : ''}

            ${r.fixes ? `<div style="margin-top:0.9rem;">
              <div class="release-section-label">Fixes</div>
              ${linesToList(r.fixes)}
            </div>` : ''}

            ${r.area_tags ? `<div style="margin-top:0.9rem;">
              ${r.area_tags.split(',').map(t => `<span class="release-tag">${escapeHtml(t)}</span>`).join('')}
            </div>` : ''}
          </div>
        `).join('');
      }

      searchInput.addEventListener('input', e => render(e.target.value));

      fetch(url)
        .then(r => r.json())
        .then(data => {
          releases = data.items || [];
          loading.style.display = 'none';
          if (!releases.length) {
            empty.style.display = 'block';
            return;
          }
          render('');
        })
        .catch(() => {
          loading.style.display = 'none';
          error.style.display = 'block';
        });
    </script>
  </body>
</html>
