<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PODFY — Release notes</title>
  <meta name="description" content="Release notes for the Podfy app: versions, fixes, and new functionality." />
  <link rel="canonical" href="https://podfy.net/releases" />

  <!-- Basic SEO -->
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="format-detection" content="telephone=no,address=no,email=no" />

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="PODFY — Release notes" />
  <meta property="og:description" content="A detailed history of updates to the Podfy app and delivery portal." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://podfy.net/releases" />
  <meta property="og:image" content="https://podfy.net/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PODFY — Release notes" />
  <meta name="twitter:description" content="A detailed history of updates to the Podfy app and delivery portal." />
  <meta name="twitter:image" content="https://podfy.net/assets/og-image.png" />

  <!-- Light/Dark UI colors -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1D3557" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/assets/podfy-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

  <!-- Unified Podfy stylesheet -->
  <link rel="stylesheet" href="/assets/styles.css?v=dev13">
</head>
<body class="antialiased">
  <a href="#main"
     class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-white focus:border focus:px-3 focus:py-2">
    Skip to content
  </a>

  [[PODFY_HEADER]]

  <!-- Subheader with title, meta, and search -->
  <section class="site-subheader" aria-label="Release notes header">
    <div class="site-subheader-container">
      <div class="shell-bar shell-bar-glass site-subheader-inner">
        <div class="site-subheader-left">
          <div class="site-subheader-text">
            <div class="site-subheader-title text-2xl font-bold tracking-tight">
              Release notes
            </div>
            <p id="releases-meta" class="site-subheader-subtitle text-sm text-muted mt-1">
              Loading release notes…
            </p>
          </div>
        </div>
        <div class="site-subheader-right">
          <label class="sr-only" for="release-search">Search release notes</label>
          <div class="shell-bar-search">
            <input
              id="release-search"
              class="search-input bg-surface border-line"
              type="search"
              placeholder="Search by version, text, or tag" />
          </div>
        </div>
      </div>
    </div>
  </section>

  <main id="main" class="container release-page">
    <p id="releases-loading" class="mt-2 text-sm text-muted">
      Fetching latest releases from the Podfy database.
    </p>
    <p id="releases-empty" class="mt-2 text-sm text-muted" style="display:none;">
      No release notes are published yet.
    </p>
    <p id="releases-error" class="mt-2 text-sm" style="display:none;color:#e11d48;">
      There was a problem loading release notes. Please refresh the page.
    </p>

    <!-- Legacy desktop table (kept for structure, hidden by CSS) -->
    <div class="release-table-view mt-4">
      <table class="release-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Version</th>
            <th>Deployment</th>
            <th>Updates</th>
          </tr>
        </thead>
        <tbody id="releases-table-body"></tbody>
      </table>
    </div>

    <!-- Card view (all breakpoints) -->
    <div class="release-cards-view mt-6" id="releases-cards-wrapper"></div>

    <!-- Pagination controls -->
    <div class="release-pagination mt-6" id="releases-pagination" style="display:none;">
      <button id="releases-prev" class="btn btn-secondary btn-sm" type="button">
        Previous
      </button>
      <span id="releases-page-info" class="text-sm text-muted" style="margin:0 0.75rem;">
        Page 1 of 1
      </span>
      <button id="releases-next" class="btn btn-secondary btn-sm" type="button">
        Next
      </button>
    </div>
  </main>

  [[PODFY_FOOTER]]

  <script>
    (function () {
      var API_URL = "/api/releases";
      var PAGE_SIZE = 25;

      var allReleases = [];
      var totalReleases = 0;
      var currentPage = 1;
      var totalPages = 1;
      var currentFilter = "";

      var loadingEl = document.getElementById("releases-loading");
      var emptyEl = document.getElementById("releases-empty");
      var errorEl = document.getElementById("releases-error");
      var metaEl = document.getElementById("releases-meta");
      var tableBody = document.getElementById("releases-table-body");
      var cardsWrapper = document.getElementById("releases-cards-wrapper");
      var searchInput = document.getElementById("release-search");

      var paginationEl = document.getElementById("releases-pagination");
      var prevBtn = document.getElementById("releases-prev");
      var nextBtn = document.getElementById("releases-next");
      var pageInfo = document.getElementById("releases-page-info");

      function escapeHtml(str) {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Convert multi-line text into a bullet list
      // and strip any leading "- " / "– " to avoid double bullets.
      function toLinesList(text) {
        if (!text) return "";
        var lines = text
          .split(/\r?\n/)
          .map(function (l) {
            var t = l.trim();
            if (t.startsWith("- ")) t = t.slice(2);
            else if (t.startsWith("– ")) t = t.slice(2);
            return t;
          })
          .filter(Boolean);

        if (lines.length <= 1) {
          return "<p>" + escapeHtml(lines[0] || text) + "</p>";
        }

        return (
          '<ul class="list-disc list-inside">' +
          lines
            .map(function (l) { return "<li>" + escapeHtml(l) + "</li>"; })
            .join("") +
          "</ul>"
        );
      }

      function toId(version) {
        if (!version) return "";
        return "v-" + version.replace(/[^0-9a-z]/gi, "-");
      }

      function tagsFrom(area_tags) {
        if (!area_tags) return [];
        return area_tags
          .split(",")
          .map(function (t) { return t.trim(); })
          .filter(Boolean);
      }

      function updatePaginationControls() {
        if (!paginationEl) return;

        if (totalReleases <= PAGE_SIZE && currentPage === 1) {
          paginationEl.style.display = "none";
          return;
        }

        paginationEl.style.display = "flex";

        if (pageInfo) {
          pageInfo.textContent =
            "Page " + currentPage + " of " + (totalPages || 1);
        }

        if (prevBtn) prevBtn.disabled = currentPage <= 1;
        if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
      }

      function render(filter) {
        filter = (typeof filter === "string" ? filter : currentFilter || "").toLowerCase();
        currentFilter = filter;

        var filtered = allReleases.filter(function (r) {
          if (!filter) return true;
          var blob = [
            r.version,
            r.release_date,
            r.deployment_ref,
            r.fixes,
            r.new_features,
            r.area_tags
          ].join(" ").toLowerCase();
          return blob.indexOf(filter) !== -1;
        });

        if (!filtered.length) {
          loadingEl.style.display = "none";
          emptyEl.style.display = "block";
          errorEl.style.display = "none";
          tableBody.innerHTML = "";
          cardsWrapper.innerHTML = "";
          if (metaEl) {
            metaEl.textContent =
              "No releases match the current filter on this page (page " +
              currentPage +
              " of " +
              (totalPages || 1) +
              ").";
          }
          updatePaginationControls();
          return;
        }

        loadingEl.style.display = "none";
        emptyEl.style.display = "none";
        errorEl.style.display = "none";

        if (metaEl) {
          metaEl.textContent =
            "Showing " +
            filtered.length +
            " of " +
            totalReleases +
            " releases (page " +
            currentPage +
            " of " +
            (totalPages || 1) +
            ").";
        }

        /* TABLE ROWS (legacy structure) */
        tableBody.innerHTML = filtered
          .map(function (r) {
            var updates = "";
            if (r.new_features) {
              updates +=
                '<div><div class="release-section-label">New</div>' +
                toLinesList(r.new_features) +
                "</div>";
            }
            if (r.fixes) {
              updates +=
                '<div class="mt-2"><div class="release-section-label">Fixes</div>' +
                toLinesList(r.fixes) +
                "</div>";
            }
            var tags = tagsFrom(r.area_tags);
            if (tags.length) {
              updates +=
                '<div class="mt-2">' +
                tags
                  .map(function (t) {
                    return '<span class="pill">' + escapeHtml(t) + "</span>";
                  })
                  .join("") +
                "</div>";
            }

            return (
              '<tr id="' +
              toId(r.version) +
              '">' +
              "<td>" +
              escapeHtml(r.release_date || "") +
              "</td>" +
              "<td><strong>" +
              escapeHtml(r.version || "") +
              "</strong></td>" +
              "<td>" +
              escapeHtml(r.deployment_ref || "") +
              "</td>" +
              "<td>" +
              updates +
              "</td>" +
              "</tr>"
            );
          })
          .join("");

        /* CARD VIEW — title + tags top, New/Fixes bottom (2 cols on md+) */
        cardsWrapper.innerHTML = filtered
          .map(function (r) {
            var tags = tagsFrom(r.area_tags);
            var tagsHtml = tags.length
              ? '<div class="flex flex-wrap gap-1 text-xs text-muted release-card-tags">' +
                tags
                  .map(function (t) {
                    return '<span class="pill">' + escapeHtml(t) + "</span>";
                  })
                  .join("") +
                "</div>"
              : "";

            // Title line: Release, Version, Build
            var titleParts = [];
            if (r.release_date) {
              titleParts.push("Release: " + r.release_date);
            }
            if (r.version) {
              titleParts.push("Version: " + r.version);
            }
            if (r.deployment_ref) {
              titleParts.push("Build: " + r.deployment_ref);
            }
            var titleLine = titleParts.join(" · ");

            return (
              '<article class="manual-card card card-glass release-card" id="' +
              toId(r.version) +
              '">' +

                // TOP: title left, tags right
                '<div class="release-card-header">' +
                  '<div class="flex flex-wrap items-start justify-between gap-3">' +
                    '<div class="release-card-title">' +
                      '<div class="text-lg font-semibold tracking-tight">' +
                        escapeHtml(titleLine) +
                      "</div>" +
                    "</div>" +
                    tagsHtml +
                  "</div>" +
                "</div>" +

                // BOTTOM: New (left) and Fixes (right)
                '<div class="release-card-body mt-4">' +
                  '<div class="flex flex-col md:flex-row gap-6">' +
                    (r.new_features
                      ? '<section class="flex-1">' +
                          '<div class="release-section-label">New</div>' +
                          toLinesList(r.new_features) +
                        "</section>"
                      : "") +
                    (r.fixes
                      ? '<section class="flex-1">' +
                          '<div class="release-section-label">Fixes</div>' +
                          toLinesList(r.fixes) +
                        "</section>"
                      : "") +
                  "</div>" +
                "</div>" +

              "</article>"
            );
          })
          .join("");

        updatePaginationControls();
      }

      function loadPage(page) {
        currentPage = page || 1;
        loadingEl.style.display = "block";
        emptyEl.style.display = "none";
        errorEl.style.display = "none";

        var url =
          API_URL +
          "?page=" +
          encodeURIComponent(currentPage) +
          "&pageSize=" +
          encodeURIComponent(PAGE_SIZE);

        fetch(url)
          .then(function (res) {
            if (!res.ok) {
              throw new Error("HTTP " + res.status);
            }
            return res.json();
          })
          .then(function (data) {
            allReleases = data.items || [];
            totalReleases = data.total || allReleases.length;
            totalPages = data.totalPages || 1;
            currentPage = data.page || currentPage;

            if (!allReleases.length) {
              loadingEl.style.display = "none";
              emptyEl.style.display = "block";
              if (metaEl) {
                metaEl.textContent =
                  "No release notes are published yet for this page.";
              }
              updatePaginationControls();
              return;
            }

            render(currentFilter);
          })
          .catch(function () {
            loadingEl.style.display = "none";
            errorEl.style.display = "block";
            if (metaEl) {
              metaEl.textContent = "Unable to load release notes.";
            }
          });
      }

      /* Search */
      if (searchInput) {
        searchInput.addEventListener("input", function (e) {
          currentFilter = e.target.value || "";
          render(currentFilter);
        });
      }

      /* Pagination buttons */
      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          if (currentPage > 1) {
            loadPage(currentPage - 1);
          }
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          if (currentPage < totalPages) {
            loadPage(currentPage + 1);
          }
        });
      }

      /* Initial load */
      loadPage(1);
    })();
  </script>
  <script src="/assets/theme.js" defer></script>
</body>
</html>
