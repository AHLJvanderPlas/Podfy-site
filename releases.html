<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PODFY — Release notes</title>
  <meta name="description" content="Release notes for the Podfy app: versions, fixes, and new functionality." />
  <link rel="canonical" href="https://podfy.net/releases" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1D3557" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#0B1220" />

  <link rel="icon" type="image/svg+xml" href="/assets/podfy-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

  <!-- Unified Podfy stylesheet -->
  <link rel="stylesheet" href="/assets/styles.css?v=6">
</head>
<body class="text-slate-800 antialiased">

  [[PODFY_HEADER]]

  <main class="release-page">
    <h1 class="text-3xl font-bold">Release notes</h1>
    <p class="mt-2 text-sm text-muted" id="releases-meta">
      Loading release notes…
    </p>

    <div class="mt-4">
      <input
        id="release-search"
        class="search-input"
        type="search"
        placeholder="Search by version, text, or tag" />
    </div>

    <p id="releases-loading" class="mt-2 text-sm text-muted">
      Fetching latest releases from the Podfy database.
    </p>
    <p id="releases-empty" class="mt-2 text-sm text-muted" style="display:none;">
      No release notes are published yet.
    </p>
    <p id="releases-error" class="mt-2 text-sm" style="display:none;color:#e11d48;">
      There was a problem loading release notes. Please refresh the page.
    </p>

    <!-- Desktop table view -->
    <div class="release-table-view mt-4">
      <table class="release-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Version</th>
            <th>Deployment</th>
            <th>Updates</th>
          </tr>
        </thead>
        <tbody id="releases-table-body"></tbody>
      </table>
    </div>

    <!-- Mobile card view -->
    <div class="release-cards-view mt-4" id="releases-cards-wrapper"></div>
  </main>

  [[PODFY_FOOTER]]

  <script>
    (function () {
      var apiUrl = '/api/releases';
      var allReleases = [];

      var loadingEl = document.getElementById('releases-loading');
      var emptyEl = document.getElementById('releases-empty');
      var errorEl = document.getElementById('releases-error');
      var metaEl = document.getElementById('releases-meta');
      var tableBody = document.getElementById('releases-table-body');
      var cardsWrapper = document.getElementById('releases-cards-wrapper');
      var searchInput = document.getElementById('release-search');

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function toLinesList(text) {
        if (!text) return '';
        var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        if (lines.length <= 1) {
          return '<p>' + escapeHtml(lines[0] || text) + '</p>';
        }
        return '<ul class="list-disc list-inside">' +
          lines.map(function (l) { return '<li>' + escapeHtml(l) + '</li>'; }).join('') +
        '</ul>';
      }

      function toId(version) {
        if (!version) return '';
        return 'v-' + version.replace(/[^0-9a-z]/gi, '-');
      }

      function tagsFrom(area_tags) {
        if (!area_tags) return [];
        return area_tags
          .split(',')
          .map(function (t) { return t.trim(); })
          .filter(Boolean);
      }

      function render(filter) {
        filter = (filter || '').toLowerCase();

        var filtered = allReleases.filter(function (r) {
          if (!filter) return true;
          var blob = [
            r.version,
            r.release_date,
            r.deployment_ref,
            r.fixes,
            r.new_features,
            r.area_tags
          ].join(' ').toLowerCase();
          return blob.indexOf(filter) !== -1;
        });

        if (!filtered.length) {
          if (metaEl) metaEl.textContent = 'No releases match the current filter.';
          loadingEl.style.display = 'none';
          emptyEl.style.display = 'block';
          errorEl.style.display = 'none';
          tableBody.innerHTML = '';
          cardsWrapper.innerHTML = '';
          return;
        }

        loadingEl.style.display = 'none';
        emptyEl.style.display = 'none';
        errorEl.style.display = 'none';

        if (metaEl) {
          metaEl.textContent = 'Showing ' + filtered.length + ' of ' + allReleases.length + ' releases.';
        }

        // Desktop table
        tableBody.innerHTML = filtered.map(function (r) {
          var updates = '';
          if (r.new_features) {
            updates += '<div><div class="release-section-label">New</div>' +
              toLinesList(r.new_features) + '</div>';
          }
          if (r.fixes) {
            updates += '<div class="mt-2"><div class="release-section-label">Fixes</div>' +
              toLinesList(r.fixes) + '</div>';
          }
          var tags = tagsFrom(r.area_tags);
          if (tags.length) {
            updates += '<div class="mt-2">' +
              tags.map(function (t) {
                return '<span class="release-tag">' + escapeHtml(t) + '</span>';
              }).join('') +
              '</div>';
          }

          return (
            '<tr id="' + toId(r.version) + '">' +
              '<td>' + escapeHtml(r.release_date || '') + '</td>' +
              '<td><strong>' + escapeHtml(r.version || '') + '</strong></td>' +
              '<td>' + escapeHtml(r.deployment_ref || '') + '</td>' +
              '<td>' + updates + '</td>' +
            '</tr>'
          );
        }).join('');

        // Mobile cards
        cardsWrapper.innerHTML = filtered.map(function (r) {
          var tags = tagsFrom(r.area_tags);
          var tagsHtml = tags.length
            ? '<div class="mt-2">' +
              tags.map(function (t) {
                return '<span class="release-tag">' + escapeHtml(t) + '</span>';
              }).join('') +
              '</div>'
            : '';

          return (
            '<article class="release-card" id="' + toId(r.version) + '">' +
              '<div class="release-card-header">' +
                '<div>' +
                  '<div class="text-xs text-slate-600">' + escapeHtml(r.release_date || '') + '</div>' +
                  '<div class="text-lg font-semibold">' + escapeHtml(r.version || '') + '</div>' +
                '</div>' +
                (r.deployment_ref
                  ? '<div class="text-xs text-slate-600">Deploy ' + escapeHtml(r.deployment_ref) + '</div>'
                  : '') +
              '</div>' +
              (r.new_features
                ? '<div class="mt-3"><div class="release-section-label">New</div>' +
                    toLinesList(r.new_features) +
                  '</div>'
                : '') +
              (r.fixes
                ? '<div class="mt-3"><div class="release-section-label">Fixes</div>' +
                    toLinesList(r.fixes) +
                  '</div>'
                : '') +
              tagsHtml +
            '</article>'
          );
        }).join('');
      }

      fetch(apiUrl)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          allReleases = (data && data.items) || [];
          if (!allReleases.length) {
            loadingEl.style.display = 'none';
            emptyEl.style.display = 'block';
            if (metaEl) metaEl.textContent = 'No release notes are published yet.';
            return;
          }
          render('');
        })
        .catch(function () {
          loadingEl.style.display = 'none';
          errorEl.style.display = 'block';
          if (metaEl) metaEl.textContent = 'Unable to load release notes.';
        });

      if (searchInput) {
        searchInput.addEventListener('input', function (e) {
          render(e.target.value || '');
        });
      }
    })();
  </script>
</body>
</html>
